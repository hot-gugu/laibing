.people-selected-tag{height:28px;border:1px solid #cfe1ff;border-radius:6px;background:#eef6ff;color:var(--primary);padding:0 8px;font-size:12px}
.people-selected-empty{font-size:12px;color:var(--muted)}

.people-tree-item{display:flex;align-items:center;gap:8px}

.people-table-scroll{flex:1;min-height:0;overflow:auto}

function persist(next){try{localStorage.setItem(key,JSON.stringify(next));records=next;render();return true}catch(e){toast('保存失败，存储空间可能不足，请减少图片后重试');return false}}
function toast(t){$('toast').textContent=t;$('toast').style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').style.display='none',3000)}
function choice(id,value,options,onchange){const host=$(id);if(['organizationFilter','levelFilter','statusFilter','daysFilter'].includes(id)){const title={organizationFilter:'所属组织',levelFilter:'隐患等级',statusFilter:'整改状态',daysFilter:'超期天数'}[id];host.innerHTML='<button type="button" class="filter-trigger" aria-haspopup="dialog"><span>'+esc(value)+'</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m7 10 5 5 5-5"/></svg></button>';host.onclick=()=>openFilterSheet(title,value,options,onchange);return}host.innerHTML='<details class="choice"><summary>'+esc(value)+'</summary><div class="options">'+options.map((o,i)=>'<button type="button" data-index="'+i+'">'+esc(o.label??o)+'</button>').join('')+'</div></details>';host.onclick=e=>{const b=e.target.closest('[data-index]');if(b){host.querySelector('details').open=false;onchange(options[+b.dataset.index].value??options[+b.dataset.index])}}}
function eligibleReviewers(r,node=r.status){return users.filter(u=>node==='待一审'?u.role==='班组长'&&u.team===r.team&&u.dept===r.dept:node==='待二审'?u.dept==='安全环保部':false)}
function reviewers(r,node=r.status){const eligible=eligibleReviewers(r,node),assigned=r.auditAssignments?.[node];return Array.isArray(assigned)?eligible.filter(u=>assigned.includes(u.id)):eligible}
function isAudit(r){return reviewers(r).some(u=>u.id===actor.id)}
function nodeName(r){return r.status==='待一审'?'待初审':r.status==='待二审'?'待复审':'审核通过'}
function candidateNames(r){return reviewers(r).map(u=>u.name+'('+u.username+')').join('、')||(['待一审','待二审'].includes(r.status)?'未配置审核人员':'--')}
function candidateUsernames(r){return reviewers(r).map(u=>u.username).join('、')||'--'}
function receipt(r){return r.receivedAt||r.created||'--'}
function finishedAt(r){return r.rectifiedAt||[...r.logs].reverse().find(l=>l.action==='提交整改结果')?.time||'--'}
function auditPanel(r){return '<h3 class="section-title">审核节点</h3><div class="audit-node-list">'+['待一审','待二审'].map((node,i)=>{const action=i?'二级审核通过':'一级审核通过',completed=r.logs.slice(r.logs.map(l=>l.action).lastIndexOf('重新提交隐患')+1).reverse().find(l=>l.action===action),pending=r.status===node,rs=reviewers(r,node);return '<section class="audit-node"><div class="audit-node-head"><span>'+ (i?'二级审核 · 安全环保部':'一级审核 · 所属班组班组长')+'</span><span class="status '+(completed?'done':pending?'wait':'')+'">'+(completed?'已通过':pending?bucket(r):['待一审','待二审'].includes(r.status)?'未到此节点':'审核已完成')+'</span></div><div class="muted">审核方式：任意一人审核通过即可</div><table class="audit-table"><thead><tr><th>可审核人员</th><th>审核用户名</th></tr></thead><tbody>'+rs.map(u=>'<tr><td>'+esc(u.name)+'</td><td>'+esc(u.username)+'</td></tr>').join('')+'</tbody></table>'+(!rs.length?'<p class="muted">尚未配置该班组审核人员</p>':'')+'<div class="audit-actual">实际审核人：'+esc(completed?.who||'--')+'<br>实际审核用户名：'+esc(completed?.username||'--')+'<br>审核时间：'+esc(completed?.time||'--')+'</div></section>'}).join('')+'</div>'}

function canResubmit(r){return r.status==='审核不通过'&&r.reporterId===actor.id}

  const deadline=$('extendDeadline').value,note=$('extendNote').value.trim();
  if(!/^\d{4}-\d{2}-\d{2}$/.test(deadline)||isNaN(Date.parse(deadline))||new Date(deadline).toISOString().slice(0,10)!==deadline){$('extendError').textContent='请选择有效的整改期限';$('extendDeadline').focus();return}
  if(deadline<=currentRecord.deadline||deadline<today()){$('extendError').textContent='新整改期限须晚于原期限，且不能早于今天';$('extendDeadline').focus();return}
  if(!note){$('extendError').textContent='请填写延期说明';$('extendNote').focus();return}
  const next=structuredClone(records),n=next.find(x=>x.id===id);const oldDeadline=n.deadline;n.deadline=deadline;
  log(n,'延期','原整改期限：'+oldDeadline+'；新整改期限：'+deadline+'；延期说明：'+note);Object.assign(n.logs.at(-1),{oldDeadline,newDeadline:deadline,extensionNote:note});
  if(persist(next)){dirty=false;$('overlay').hidden=true;activeId=null;toast('延期成功，整改期限已更新')}
 };
 $('extendDeadline').focus();
}
