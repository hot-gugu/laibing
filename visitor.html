          </div></section>

          </div></section>

          <section class="form-block"><div class="block-head"><h2>访客信息</h2><button class="text-btn" id="add-visitor" type="button" hidden>＋ 添加同行人</button></div>
            <div class="person-card"><span class="role-tag">主联系人</span><div class="field-grid">
              <label class="field"><span>姓名 <b>*</b></span><input name="contactName" required placeholder="请输入姓名"></label>
              <label class="field"><span>联系电话 <b>*</b></span><input name="contactPhone" required inputmode="tel" maxlength="11" pattern="1\d{10}" placeholder="请输入11位手机号码" aria-describedby="contact-phone-tip"><small id="contact-phone-tip">施工单位人员如已录入系统，输入手机号后将自动填入基本信息。</small></label>
              <label class="field full"><span>身份证号 <b>*</b></span><input name="idNumber" required maxlength="18" placeholder="请输入18位身份证号"></label>
              <label class="upload field"><span>身份证人像面 <b>*</b></span><input name="idFront" type="file" accept="image/*" required><span class="upload-box">＋ 上传图片</span></label>
              <label class="upload field"><span>身份证国徽面 <b>*</b></span><input name="idBack" type="file" accept="image/*" required><span class="upload-box">＋ 上传图片</span></label>
            </div></div><div id="visitor-list"></div>
          </section>

          <section class="form-block"><div class="block-head"><h2>车辆信息</h2><button class="text-btn" id="add-vehicle" type="button">＋ 添加车辆</button></div><div id="vehicle-list"><p class="empty-inline">如驾车来访，请添加车辆</p></div></section>
          <label class="agreement"><input type="checkbox" name="agree" required><span>本人确认所填信息真实有效，并同意用于入厂审核与安全核验。</span></label>
          <button class="btn primary wide submit-btn" type="submit">提交预约</button>
        </form>
      </section>

    </section>
  </main>
  <div class="modal-root" id="modal-root"></div><div id="visitor-toast" class="toast" role="status" aria-live="polite"></div>

  <script data-source="visitor.js">
const STORE='gt-visitor-demo-v1';
const now=()=>new Date();
const pad=n=>String(n).padStart(2,'0');
const localDateTime=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
const dateOnly=d=>localDateTime(d).slice(0,10);
const fmt=v=>v?String(v).replace('T',' '):'—';
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const addDays=(n,h=9,m=30)=>{const d=now();d.setDate(d.getDate()+n);d.setHours(h,m,0,0);return d};
const seed=()=>({auth:false,apps:[
  {id:'LF20261009001',openid:'wx_demo_001',company:'柳州智造设备有限公司',location:'生产区域',purpose:'设备维护与技术交流',hostName:'韦宝亭',hostPhone4:'3707',startDate:dateOnly(now()),endDate:dateOnly(addDays(2)),expectedAt:localDateTime(addDays(0,9,30)),contactName:'周达广',contactPhone:'13768473707',idNumber:'452226197510233616',photos:2,visitors:['李明'],vehicles:[{plate:'桂B·A7810',origin:'柳州'}],status:'待审核',createdAt:localDateTime(addDays(0,8,40)),approval:null,gates:[],refusals:[],notifications:[{text:'已通过企业微信通知接待人',time:localDateTime(addDays(0,8,41))}]},
  {id:'LF20261008006',openid:'wx_demo_001',company:'广西恒安物流有限公司',location:'仓储区域',purpose:'送货',hostName:'韦宝亭',hostPhone4:'3707',startDate:dateOnly(addDays(-1)),endDate:dateOnly(addDays(1)),expectedAt:localDateTime(addDays(-1,10,0)),contactName:'陈晓峰',contactPhone:'13800001122',idNumber:'452201198804123519',photos:3,visitors:[],vehicles:[{plate:'桂G·6K921',origin:'来宾'}],status:'已通过',createdAt:localDateTime(addDays(-1,8,30)),approval:{result:'同意',by:'韦宝亭',time:localDateTime(addDays(-1,8,55))},gates:[{in:localDateTime(addDays(-1,9,58)),out:localDateTime(addDays(-1,11,42)),source:'当前时间',by:'门卫 王师傅',edits:[]}],refusals:[],notifications:[{text:'审核通过短信已发送',time:localDateTime(addDays(-1,8,56))}]},
  {id:'LF20261007003',openid:'wx_demo_002',company:'南宁环保技术有限公司',location:'环保站',purpose:'现场检测',hostName:'黄工',hostPhone4:'6621',startDate:dateOnly(addDays(-2)),endDate:dateOnly(addDays(-1)),expectedAt:localDateTime(addDays(-2,14,0)),contactName:'林江',contactPhone:'13900002233',idNumber:'450103199203087418',photos:2,visitors:[],vehicles:[],status:'已驳回',createdAt:localDateTime(addDays(-2,11,5)),approval:{result:'驳回',reason:'请补充检测设备清单后重新申请',by:'黄工',time:localDateTime(addDays(-2,11,30))},gates:[],refusals:[],notifications:[]}
]});
let db=JSON.parse(localStorage.getItem(STORE)||'null')||seed();
const save=()=>localStorage.setItem(STORE,JSON.stringify(db));
const toast=msg=>{const el=document.getElementById('visitor-toast');if(!el)return;el.textContent=msg;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2200)};
const statusClass=s=>s==='已通过'?'green':s==='待审核'?'orange':s==='已驳回'?'red':'gray';
const presence=a=>{const last=a.gates.at(-1);if(last&&!last.out)return new Date(a.endDate+'T23:59')<now()?'超期在场':'场内';if(last)return'已离场';return'未进场'};
const personCanCancel=a=>!a.gates.length&&['待审核','已通过'].includes(a.status);

if(document.body.dataset.view==='visitor') initVisitor();
if(document.body.dataset.view==='admin') initAdmin();

function initVisitor(){
  setupForm();
  addVisitor();
  document.getElementById('add-vehicle').onclick=addVehicle;

  document.getElementById('visit-form').addEventListener('submit',submitApplication);
  document.addEventListener('change',e=>{if(e.target.matches('input[type=file]'))previewUpload(e.target)});
}
function switchTab(tab){document.getElementById('tab-apply').hidden=tab!=='apply';document.getElementById('tab-mine').hidden=tab!=='mine';document.querySelectorAll('[data-tab]').forEach(b=>{const on=b.dataset.tab===tab;b.classList.toggle('active',on);if(b.closest('.mobile-tabs'))b.setAttribute('aria-selected',String(on))});if(tab==='mine')renderMine()}
function setupForm(){const f=document.getElementById('visit-form');if(f.dataset.ready)return;const d=now(),later=addDays(1);f.startDate.value=dateOnly(d);f.endDate.value=dateOnly(later);f.expectedAt.value=localDateTime(d);f.startDate.min=dateOnly(d);f.endDate.min=dateOnly(d);f.dataset.ready='1'}
function addVisitor(){document.getElementById('visitor-list').innerHTML=`<div class="repeat-card"><div class="repeat-title"><strong>同行人</strong></div><label class="field"><span>姓名</span><textarea id="companion-names" class="companion-name" rows="4" maxlength="2000" placeholder="请输入同行人姓名，每行一人，可填写多人"></textarea></label><label class="field" style="margin-top:16px"><span>同行人数</span><input id="companion-count" class="companion-count" type="number" min="0" step="1" inputmode="numeric" placeholder="请输入同行人数（不含主联系人）"></label></div>`}
function readCompanions(){const raw=document.getElementById('companion-names').value,names=raw.split(/[\r\n、，,；;]+/).map(name=>name.trim()).filter(Boolean),value=document.getElementById('companion-count').value;return {companionNames:raw,companionCount:value===''?null:Number(value),visitors:names.map(name=>({name}))}}
function companionTotal(a){return Number.isInteger(a.companionCount)&&a.companionCount>=0?a.companionCount:(a.visitors||[]).length}
function companionSummary(a){return detailRows([['姓名',a.companionNames||(a.visitors||[]).map(v=>typeof v==='string'?v:v.name).join('、')||'未填写'],['同行人数',String(companionTotal(a))]])}

function addVehicle(v={}){const root=document.getElementById('vehicle-list');root.querySelector('.empty-inline')?.remove();const box=document.createElement('div');box.className='repeat-card vehicle-card';box.innerHTML=`<div class="repeat-title"><strong>车辆</strong><button class="remove-btn" type="button">删除</button></div><div class="field-grid"><label class="field"><span>车牌号码 <b>*</b></span><input class="vehicle-plate" required value="${esc(v.plate||'')}" placeholder="如：桂G·12345"></label><label class="field"><span>车辆来源地 <b>*</b></span><input class="vehicle-origin" required value="${esc(v.origin||'')}" placeholder="请输入来源地"></label><label class="upload field full"><span>相关信息照片</span><input type="file" accept="image/*"><span class="upload-box">＋ 上传车辆照片</span></label></div>`;box.querySelector('.remove-btn').onclick=()=>{box.remove();if(!root.children.length)root.innerHTML='<p class="empty-inline">如驾车来访，请添加车辆</p>'};root.append(box)}
function previewUpload(input){const box=input.nextElementSibling,file=input.files[0];if(!file)return;const url=URL.createObjectURL(file);box.innerHTML=`<img src="${url}" alt="已上传图片预览">`;}
function submitApplication(e){e.preventDefault();const f=e.currentTarget;if(!f.reportValidity())return;const start=new Date(f.startDate.value),end=new Date(f.endDate.value);if(end<start||end-start>30*864e5){toast('有效期应为开始日起30天内');return}const btn=f.querySelector('[type=submit]');btn.disabled=true;btn.textContent='正在提交…';setTimeout(async()=>{const readPhoto=file=>new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)});let documentPhotos,vehicleRecords;try{documentPhotos=await Promise.all([f.idFront.files[0],f.idBack.files[0]].map(readPhoto));vehicleRecords=await Promise.all([...document.querySelectorAll('.vehicle-card')].map(async x=>({plate:x.querySelector('.vehicle-plate').value,origin:x.querySelector('.vehicle-origin').value,photo:x.querySelector('input[type=file]').files[0]?await readPhoto(x.querySelector('input[type=file]').files[0]):null})))}catch{btn.disabled=false;btn.textContent='提交预约';toast('照片读取失败，请重新上传');return}const fd=new FormData(f),id='LF'+dateOnly(now()).replaceAll('-','')+String(db.apps.length+1).padStart(3,'0');db.apps.unshift({id,openid:'wx_demo_001',company:fd.get('company'),location:fd.get('location'),purpose:fd.get('purpose'),hostName:fd.get('hostName'),hostPhone:fd.get('hostPhone'),startDate:fd.get('startDate'),endDate:fd.get('endDate'),expectedAt:fd.get('expectedAt'),contactName:fd.get('contactName'),contactPhone:fd.get('contactPhone'),idNumber:fd.get('idNumber'),photos:documentPhotos.length,documentPhotos,...readCompanions(),vehicles:vehicleRecords,status:'待审核',createdAt:localDateTime(now()),approval:null,gates:[],refusals:[],notifications:[{text:'已通过企业微信通知接待人',time:localDateTime(now())}]});save();btn.disabled=false;btn.textContent='提交预约';toast('预约已提交，已通知接待人');btn.disabled=true;btn.textContent='预约已提交';showSubmissionSuccess(db.apps.find(a=>a.id===id))},650)}
function showSubmissionSuccess(a){
  dialog(`<div class="submission-success-mark" aria-hidden="true">✓</div><h2>预约提交成功</h2><p>您的来访申请已提交，请等待接待人审核。</p><div class="submission-summary">${detailRows([['申请编号',a.id],['申请状态','待审核'],['访客姓名',a.contactName],['访客单位',a.company],['到访地点',a.location],['预计到达',fmt(a.expectedAt)],['有效期',a.startDate+' 至 '+a.endDate],['接待人',a.hostName],['接待人手机号码',a]])}</div><div class="dialog-actions"><button class="btn primary wide" type="button" id="submission-done">我知道了</button></div>`,root=>{
    root.classList.add('submission-success');
    root.querySelector('#submission-done').onclick=()=>root.remove();
    root.addEventListener('keydown',e=>{if(e.key!=='Tab')return;const items=Array.from(root.querySelectorAll('a[href],button')),first=items[0],last=items.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}});
  });
}
function bookingHostPhone(a){const examples=['13800000001','13900000002','13700000003','13600000004'];const demo=/^LF-DEMO-|^LF2026100[789]/.test(a.id||'');const index=Array.from(a.id||'').reduce((sum,c)=>sum+c.charCodeAt(0),0)%examples.length;const phone=String(a.hostPhone||(demo?examples[index]:'')).trim();return `<div class="booking-host-phone"><b>${esc(phone||'未录入')}</b>${/^1[0-9]{10}$/.test(phone)?`<a class="booking-call" href="tel:${phone}" aria-label="拨打接待人${esc(a.hostName||'')}的电话"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 3H4a1 1 0 0 0-1 1c0 9.4 7.6 17 17 17a1 1 0 0 0 1-1v-3l-5-2-2 2a14 14 0 0 1-7-7l2-2-2-5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>拨打电话</a>`:''}</div>`}

function renderMine(){const apps=db.apps.filter(a=>a.openid==='wx_demo_001'),root=document.getElementById('booking-list');document.getElementById('mine-count').textContent=apps.length?apps.length:'';root.innerHTML=apps.length?apps.map(a=>`<article class="booking-card" data-state="${a.status}"><div class="booking-top"><strong>${esc(a.company)}</strong><span class="status ${statusClass(a.status)}">${a.status}</span></div><div class="booking-meta"><span>申请编号</span><b>${esc(a.id)}</b><span>预计到达</span><b>${fmt(a.expectedAt)}</b><span>有效日期</span><b>${a.startDate} 至 ${a.endDate}</b><span>接待人员</span><b>${esc(a.hostName||'未录入')}</b><span>手机号码</span>${bookingHostPhone(a)}</div><div class="booking-actions"><button class="btn soft" data-detail="${a.id}" type="button">查看详情</button>${a.status==='已驳回'?`<button class="btn primary" data-copy="${a.id}" type="button">复制申请</button>`:''}</div></article>`).join(''):'<div class="empty-inline">暂无预约记录</div>';root.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>showMobileDetail(b.dataset.detail));root.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copyApplication(b.dataset.copy))}
function detailRows(items){return items.map(([k,v])=>`<div class="detail-row"><span>${k}</span>${k==='接待人手机号码'&&v&&typeof v==='object'?bookingHostPhone(v):`<b>${esc(v||'未录入')}</b>`}</div>`).join('')}
function mobilePhotos(a){const demo=/^LF2026100[789]|^LF-DEMO-/.test(a.id),photos=a.documentPhotos?.length?a.documentPhotos:demo&&a.photos?['resources/visitor-id-front.svg','resources/visitor-id-back.svg']:[];return photos.length?`<div class="mobile-documents">${photos.map((src,i)=>`<figure><figcaption>${i===0?'身份证人像面':i===1?'身份证国徽面':'证件照片'}</figcaption><img class="detail-photo" src="${esc(src)}" alt="证件照片 ${i+1}"></figure>`).join('')}</div>`:'<div class="empty-inline">暂无证件照片</div>'}
function showMobileDetail(id){const a=db.apps.find(x=>x.id===id),root=document.getElementById('modal-root');const events=[{text:'提交申请',time:a.createdAt},...(a.approval?[{text:a.approval.result+(a.approval.reason?'：'+a.approval.reason:''),time:a.approval.time}]:[]),...a.gates.flatMap(g=>[{text:'登记进场',time:g.in},...(g.out?[{text:'登记出场',time:g.out}]:[])])];root.innerHTML=`<section class="detail-sheet"><header class="sheet-head"><button id="close-sheet" type="button">‹</button><h2>预约详情</h2></header><div class="detail-body"><section class="detail-section"><div class="booking-top"><strong>${esc(a.company)}</strong><span class="status ${statusClass(a.status)}">${a.status}</span></div></section><section class="detail-section"><h3>来访信息</h3>${detailRows([['申请编号',a.id],['访客单位',a.company],['到访地点',a.location],['到访事由',a.purpose],['接待人姓名',a.hostName],['接待人手机号码',a],['开始日期',a.startDate],['结束日期',a.endDate],['预计到达时间',fmt(a.expectedAt)],['场内状态',presence(a)==='已进场'?'进场中':presence(a)]])}</section><section class="detail-section"><h3>主联系人</h3>${detailRows([['姓名',a.contactName],['联系电话',a.contactPhone],['身份证号',a.idNumber?'**************'+a.idNumber.slice(-4):'未录入']])}${mobilePhotos(a)}</section><section class="detail-section"><h3>同行人员</h3>${companionSummary(a)}</section><section class="detail-section"><h3>车辆信息</h3>${a.vehicles.length?a.vehicles.map(v=>`<div class="mobile-vehicle">${detailRows([['车牌号码',v.plate],['车辆来源地',v.origin||'未录入']])}${v.photo?`<img class="detail-photo" src="${esc(v.photo)}" alt="${esc(v.plate)}车辆照片">`:/^LF2026100[789]|^LF-DEMO-/.test(a.id)?'<img class="detail-photo" src="resources/visitor-vehicle.png" alt="车辆演示照片">':'<div class="empty-inline">暂无车辆照片</div>'}</div>`).join(''):'<div class="empty-inline">暂无来访车辆</div>'}</section><section class="detail-section"><h3>办理记录</h3><div class="timeline">${events.map(x=>`<div class="timeline-item"><strong>${esc(x.text)}</strong><small>${fmt(x.time)}</small></div>`).join('')}</div></section>${personCanCancel(a)?'<button class="btn danger wide" id="cancel-app" type="button">取消预约</button>':''}</div></section>`;document.getElementById('close-sheet').onclick=()=>root.innerHTML='';document.getElementById('cancel-app')?.addEventListener('click',()=>{a.status='已取消';a.notifications.push({text:'取消结果短信已发送',time:localDateTime(now())});save();root.innerHTML='';renderMine();toast('预约已取消')})}
function copyApplication(id){const a=db.apps.find(x=>x.id===id),f=document.getElementById('visit-form');switchTab('apply');f.company.value=a.company;f.location.value=a.location;f.purpose.value=a.purpose;f.hostName.value=a.hostName;f.hostPhone.value=a.hostPhone||'';f.contactName.value=a.contactName;f.contactPhone.value=a.contactPhone;document.getElementById('companion-names').value=a.companionNames||(a.visitors||[]).map(v=>typeof v==='string'?v:v.name).join('\n');document.getElementById('companion-count').value=a.companionCount??'';toast('已复制非敏感信息，请补充证件资料')}

function initAdmin(){let role='reception';const render=()=>renderAdmin(role);document.querySelectorAll('[data-role]').forEach((b,i)=>{b.setAttribute('aria-pressed',String(i===0));b.onclick=()=>{role=b.dataset.role;document.querySelectorAll('[data-role]').forEach(x=>{const on=x===b;x.classList.toggle('active',on);x.setAttribute('aria-pressed',String(on))});document.getElementById('role-caption').textContent=role==='reception'?'审核分配给您的来访申请':'核验已通过申请并登记进出时间';render()}});document.getElementById('status-filter').onchange=render;document.getElementById('keyword-filter').oninput=render;document.getElementById('reset-data').onclick=()=>{db=seed();save();render();toast('演示数据已重置')};render()}
function renderAdmin(role){const status=document.getElementById('status-filter').value,key=document.getElementById('keyword-filter').value.trim().toLowerCase();let rows=db.apps.filter(a=>role==='guard'||a.hostName==='韦宝亭').filter(a=>(status==='all'||a.status===status)&&(!key||[a.id,a.company,a.contactName].some(v=>v.toLowerCase().includes(key))));const metrics=[['待审核',db.apps.filter(a=>a.status==='待审核').length,'#d98600'],['已通过',db.apps.filter(a=>a.status==='已通过').length,'#0879ff'],['当前场内',db.apps.filter(a=>presence(a)==='场内').length,'#12a36a'],['超期在场',db.apps.filter(a=>presence(a)==='超期在场').length,'#ef2f4f']];document.getElementById('visitor-metrics').innerHTML=metrics.map(m=>`<article class="metric" style="--accent:${m[2]}"><span>${m[0]}</span><strong>${m[1]}</strong></article>`).join('');document.getElementById('result-count').textContent=`共 ${rows.length} 条`;const tbody=document.getElementById('visitor-tbody');tbody.innerHTML=rows.map(a=>`<tr><td><span class="cell-main">${a.id}</span><span class="cell-sub">${fmt(a.createdAt)}</span></td><td><span class="cell-main">${esc(a.contactName)}</span><span class="cell-sub">${esc(a.company)}</span></td><td>${esc(a.hostName)}</td><td>${a.startDate}<span class="cell-sub">至 ${a.endDate}</span></td><td>${fmt(a.expectedAt)}</td><td><span class="status ${statusClass(a.status)}">${a.status}</span></td><td><span class="status blue">${presence(a)}</span></td><td><div class="row-actions"><button class="row-btn" data-view-id="${a.id}">查看</button>${actionButton(a,role)}</div></td></tr>`).join('');document.getElementById('admin-empty').hidden=!!rows.length;tbody.querySelectorAll('[data-view-id]').forEach(b=>b.onclick=()=>openDrawer(b.dataset.viewId,role));tbody.querySelectorAll('[data-action-id]').forEach(b=>b.onclick=()=>openAction(b.dataset.actionId,b.dataset.action,role))}
function actionButton(a,role){if(role==='reception'&&a.status==='待审核')return`<button class="row-btn" data-action-id="${a.id}" data-action="approve">审核</button>`;if(role==='guard'&&a.status==='已通过'){const p=presence(a);if(p==='场内'||p==='超期在场')return`<button class="row-btn" data-action-id="${a.id}" data-action="exit">登记出场</button>`;return`<button class="row-btn" data-action-id="${a.id}" data-action="enter">登记进场</button>`}return''}
function openDrawer(id,role){const a=db.apps.find(x=>x.id===id),root=document.getElementById('admin-overlay');root.innerHTML=`<div class="drawer-overlay"><aside class="admin-drawer"><header class="drawer-head"><div><h2>访客申请详情</h2><p>${a.id}</p></div><button class="icon-btn" id="close-drawer">×</button></header><div class="drawer-body"><section class="drawer-section"><h3>来访信息</h3><div class="info-grid">${[['申请状态',a.status],['场内状态',presence(a)],['访客单位',a.company],['到访地点',a.location],['到访事由',a.purpose],['接待人员',a.hostName],['有效期',a.startDate+' 至 '+a.endDate],['预计到达',fmt(a.expectedAt)]].map(x=>`<div class="info"><span>${x[0]}</span><b>${esc(x[1])}</b></div>`).join('')}</div></section><section class="drawer-section"><h3>人员与车辆</h3><div class="info-grid">${[['主联系人',a.contactName],['联系电话',a.contactPhone],['身份证号','**************'+a.idNumber.slice(-4)],['证件照片',a.photos?'已上传 '+Math.min(a.photos,2)+' 张':'未上传'],['同行人员',a.visitors.map(v=>typeof v==='string'?v:v.name).join('、')||'无'],['车辆信息',a.vehicles.map(v=>v.plate+'（'+v.origin+'）').join('、')||'无']].map(x=>`<div class="info"><span>${x[0]}</span><b>${esc(x[1])}</b></div>`).join('')}</div></section><section class="drawer-section"><h3>进出记录</h3>${a.gates.length?a.gates.map((g,i)=>`<div class="info" style="margin-bottom:8px"><span>第 ${i+1} 次 · ${esc(g.source)}</span><b>进场 ${fmt(g.in)}<br>出场 ${fmt(g.out)}</b><small>${esc(g.by)}${g.edits.length?' · 已修正 '+g.edits.length+' 次':''}</small></div>`).join(''):'<div class="empty-inline">暂无进出记录</div>'}</section></div><footer class="drawer-footer"><button class="btn soft" id="close-drawer-2">关闭</button>${a.gates.length?`<button class="btn primary" id="edit-time">修正时间</button>`:''}</footer></aside></div>`;root.querySelectorAll('#close-drawer,#close-drawer-2').forEach(b=>b.onclick=()=>root.innerHTML='');document.getElementById('edit-time')?.addEventListener('click',()=>openTimeEdit(a,role))}
const openDrawerBase=openDrawer;
openDrawer=function(id,role){const previous=document.activeElement;openDrawerBase(id,role);const root=document.getElementById('admin-overlay'),drawer=root.querySelector('.admin-drawer'),title=drawer?.querySelector('h2');if(!drawer)return;title.id='drawer-title';drawer.setAttribute('role','dialog');drawer.setAttribute('aria-modal','true');drawer.setAttribute('aria-labelledby','drawer-title');const onKey=e=>{if(e.key==='Escape')close()},close=()=>{document.removeEventListener('keydown',onKey);root.innerHTML='';previous?.focus()};document.addEventListener('keydown',onKey);root.querySelectorAll('#close-drawer,#close-drawer-2').forEach(b=>b.onclick=close);root.querySelector('#close-drawer').setAttribute('aria-label','关闭详情');root.querySelector('#close-drawer').focus()};
function openAction(id,action,role){const a=db.apps.find(x=>x.id===id);if(action==='approve')return approvalDialog(a,role);if(action==='enter')return gateDialog(a,'enter',role);if(action==='exit')return gateDialog(a,'exit',role)}
function approvalDialog(a,role){dialog(`<h2>审核来访申请</h2><p>${esc(a.contactName)} · ${esc(a.company)}</p><label>驳回原因<textarea id="reason" placeholder="选择驳回时必须填写原因"></textarea></label><div class="dialog-actions"><button class="btn danger" id="reject">驳回</button><button class="btn primary" id="approve">同意</button></div>`,root=>{root.querySelector('#approve').onclick=()=>{a.status='已通过';a.approval={result:'同意',by:'韦宝亭',time:localDateTime(now())};a.notifications.push({text:'审核通过短信已发送',time:localDateTime(now())});save();root.remove();renderAdmin(role);toast('已同意并通知访客')};root.querySelector('#reject').onclick=()=>{const reason=root.querySelector('#reason').value.trim();if(!reason)return toast('请填写驳回原因');a.status='已驳回';a.approval={result:'驳回',reason,by:'韦宝亭',time:localDateTime(now())};save();root.remove();renderAdmin(role);toast('已驳回并通知访客')}})}
function gateDialog(a,type,role){const expected=new Date(a.expectedAt),same=dateOnly(expected)===dateOnly(now()),initial=type==='enter'?(same?a.expectedAt:localDateTime(now())):localDateTime(now()),source=same&&type==='enter'?'访客填写的预计到达时间':'门岗当前时间';dialog(`<h2>${type==='enter'?'登记进场':'登记出场'}</h2><p>请核验主联系人证件与申请信息一致后确认。</p><label>${type==='enter'?'进场':'出场'}时间<input id="gate-time" type="datetime-local" value="${initial}"></label><div class="source-note" id="source-note">时间来源：${source}</div>${type==='enter'?'<button class="btn soft" id="use-now" type="button">更新为当前时间</button>':''}<label><input id="verified" type="checkbox"> 已核验现场证件与主联系人信息一致</label><div class="dialog-actions">${type==='enter'?'<button class="btn danger" id="refuse">拒绝本次进场</button>':''}<button class="btn primary" id="confirm-gate">确认登记</button></div>`,root=>{root.querySelector('#use-now')?.addEventListener('click',()=>{root.querySelector('#gate-time').value=localDateTime(now());root.querySelector('#source-note').textContent='时间来源：门岗当前时间'});root.querySelector('#confirm-gate').onclick=()=>{if(!root.querySelector('#verified').checked)return toast('请先确认已完成证件核验');const time=root.querySelector('#gate-time').value;if(type==='enter')a.gates.push({in:time,out:null,source:root.querySelector('#source-note').textContent.replace('时间来源：',''),by:'门卫 王师傅',edits:[]});else a.gates.at(-1).out=time;save();root.remove();renderAdmin(role);toast(type==='enter'?'已登记进场':'已登记出场')};root.querySelector('#refuse')?.addEventListener('click',()=>refusalDialog(a,role,root))})}
function refusalDialog(a,role,old){old.remove();dialog(`<h2>拒绝本次进场</h2><p>申请仍保持有效，拒绝原因将记录在门岗事件中。</p><label>拒绝原因<textarea id="reason" placeholder="请填写证件不符等具体原因"></textarea></label><div class="dialog-actions"><button class="btn danger" id="confirm-refuse">确认拒绝</button></div>`,root=>{root.querySelector('#confirm-refuse').onclick=()=>{const reason=root.querySelector('#reason').value.trim();if(!reason)return toast('请填写拒绝原因');a.refusals.push({reason,by:'门卫 王师傅',time:localDateTime(now())});save();root.remove();renderAdmin(role);toast('已记录本次拒绝进场')}})}
function openTimeEdit(a,role){document.getElementById('admin-overlay').innerHTML='';const g=a.gates.at(-1);dialog(`<h2>修正进出时间</h2><p>修改会保留原值、操作人和修改时间。</p><label>进场时间<input id="edit-in" type="datetime-local" value="${g.in}"></label><label>出场时间<input id="edit-out" type="datetime-local" value="${g.out||''}"></label><label>修改原因<textarea id="edit-reason" placeholder="必填，请说明补录或修正原因"></textarea></label><div class="dialog-actions"><button class="btn primary" id="save-edit">保存修正</button></div>`,root=>{root.querySelector('#save-edit').onclick=()=>{const reason=root.querySelector('#edit-reason').value.trim();if(!reason)return toast('请填写修改原因');g.edits.push({before:{in:g.in,out:g.out},after:{in:root.querySelector('#edit-in').value,out:root.querySelector('#edit-out').value||null},reason,by:'门卫 王师傅',time:localDateTime(now())});g.in=root.querySelector('#edit-in').value;g.out=root.querySelector('#edit-out').value||null;save();root.remove();renderAdmin(role);toast('时间已修正并记录审计日志')}})}
function dialog(html,bind){const previous=document.activeElement,root=document.createElement('div');root.className='dialog-wrap';root.innerHTML=`<section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">${html.replace('<h2>','<h2 id="dialog-title">')}</section>`;const nativeRemove=root.remove.bind(root),onKey=e=>{if(e.key==='Escape')root.remove()};root.remove=()=>{document.removeEventListener('keydown',onKey);nativeRemove();previous?.focus()};root.onclick=e=>{if(e.target===root)root.remove()};document.addEventListener('keydown',onKey);document.body.append(root);bind(root);setTimeout(()=>root.querySelector('input,textarea,button')?.focus())}

  </script>
<script src="visitor-purpose-config.js"></script>
<script src="prototype-annotations-data.js"></script>
<script src="prototype-annotations.js"></script>
</body>
