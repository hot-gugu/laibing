<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef6ff">
<title>安全生产 · 移动工作台</title>
<style>
:root{--primary:#0879ff;--ink:#24344d;--deep:#172033;--muted:#8190a5;--line:rgba(190,211,238,.95);--soft:#eef6ff;--shadow:0 8px 20px rgba(45,87,140,.06)}
*{box-sizing:border-box}body{margin:0;background:#edf3fa;color:var(--ink);font:14px/1.5 "Microsoft YaHei","PingFang SC",sans-serif}.app{width:min(100%,520px);min-height:100vh;min-height:100dvh;margin:auto;background:#f7faff;box-shadow:var(--shadow)}.top{height:64px;padding-top:env(safe-area-inset-top);box-sizing:content-box;display:flex;align-items:center;justify-content:center;background:var(--soft)}h1{margin:0;font-size:20px;font-weight:600;color:var(--deep)}main{padding:20px 16px calc(32px + env(safe-area-inset-bottom))}.banner{position:relative;isolation:isolate;overflow:hidden;min-height:194px;border-radius:8px;background:linear-gradient(115deg,#0879ff,#3d8fff);color:white;padding:30px 22px;display:flex;align-items:center}.banner:before,.banner:after{content:"";position:absolute;z-index:-1;border-radius:50%;background:rgba(255,255,255,.08);width:400px;height:400px;right:-210px;top:-190px}.banner:after{right:-60px;top:150px;width:500px;height:250px}.banner-copy{z-index:2}.banner h2{font-size:30px;font-weight:600;letter-spacing:3px;line-height:1.3;margin:0 0 12px}.banner p{margin:0;font-size:15px;letter-spacing:1px;color:rgba(255,255,255,.92)}.banner-art{position:absolute;width:176px;height:176px;right:-5px;top:8px;opacity:.9}.banner-mark{display:flex;gap:5px;margin-top:27px}.banner-mark span{width:6px;height:4px;border-radius:8px;background:rgba(255,255,255,.4)}.banner-mark span:first-child{width:20px;background:white}.applications{margin-top:18px;padding:18px 16px 24px;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}.section-heading{font-size:15px;font-weight:400;margin:0 0 20px;color:var(--deep);display:flex;align-items:center;gap:8px}.section-heading:before{content:"";height:14px;width:4px;border-radius:999px;background:linear-gradient(180deg,#0879ff,#6a4df5)}.app-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.app-link{display:flex;flex-direction:column;align-items:center;gap:10px;padding:4px 0 8px;min-height:98px;text-decoration:none;color:var(--ink);border-radius:8px;-webkit-tap-highlight-color:transparent}.app-link:active{background:var(--soft)}.app-link:focus-visible{outline:2px solid var(--primary);outline-offset:3px}.app-icon{width:58px;height:58px;display:grid;place-items:center;border-radius:14px;background:linear-gradient(155deg,#3d8fff,#0879ff);box-shadow:0 5px 12px rgba(8,121,255,.14);color:white}.app-icon.green{background:linear-gradient(155deg,#34c990,#12a36a);box-shadow:0 5px 12px rgba(18,163,106,.14)}.app-link span:last-child{font-size:14px;white-space:nowrap}.app-icon svg{width:32px;height:32px}@media(max-width:360px){.app-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.banner{padding-left:18px}.banner h2{font-size:28px}.banner-art{right:-28px;opacity:.65}}

main{padding:18px 12px 100px}.applications{padding:18px 8px;border:0;margin-top:14px}.app-grid{gap:18px 2px}.app-link{border:0;background:transparent;font:inherit;cursor:pointer;min-width:0}.app-link span:last-child{font-size:13px}.app-icon{width:54px;height:54px;box-shadow:none}.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,520px);padding:8px 12px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,1fr);background:#fff;border-top:1px solid #e7eef8;z-index:10}.bottom-nav button{border:0;background:transparent;font:inherit;color:#8190a5;display:flex;align-items:center;gap:3px;flex-direction:column;padding:4px;min-height:52px}.bottom-nav button.active{color:#0879ff}.bottom-nav svg{width:24px;height:24px}.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#24344d;color:white;border-radius:8px;padding:10px 16px;font-size:12px;max-width:90vw;z-index:20}.toast[hidden]{display:none}@media(max-width:360px){.app-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.app-link span:last-child{font-size:12px}.app-icon{width:48px;height:48px}}
</style>
<link rel="stylesheet" href="prototype-annotations.css">
</head>
<body>
<div class="app">
<header class="top"><h1>工作台</h1></header>
<main>
<section class="banner" aria-labelledby="safety-title">
<div class="banner-copy"><h2 id="safety-title">安全生产</h2><p>安全第一，预防为主</p><div class="banner-mark" aria-hidden="true"><span></span><span></span><span></span></div></div>

</section>
<section class="applications" aria-labelledby="apps-title"><h2 class="section-heading" id="apps-title" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)">业务应用</h2><nav class="app-grid" aria-label="安全生产子应用">
<button class="app-link original-app" type="button" data-original-app="安全教育培训"><span class="app-icon" style="--app-color:#3d8fff;background:linear-gradient(155deg,color-mix(in srgb,#3d8fff,white 25%),#3d8fff)"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="m3 12 13-7 13 7-13 7-13-7Z" fill="currentColor"/><path d="M8 17v7c5 4 11 4 16 0v-7M28 13v10" stroke="currentColor" stroke-width="2"/></svg></span><span>安全教育培训</span></button>
<button class="app-link original-app" type="button" data-original-app="隐患排查治理"><span class="app-icon" style="--app-color:#ee8a19;background:linear-gradient(155deg,color-mix(in srgb,#ee8a19,white 25%),#ee8a19)"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><rect x="6" y="4" width="18" height="24" rx="3" stroke="currentColor" stroke-width="2.5"/><path d="M10 10h10M10 15h6" stroke="currentColor" stroke-width="2"/><circle cx="21" cy="21" r="5" stroke="currentColor" stroke-width="2"/><path d="m25 25 4 4" stroke="currentColor" stroke-width="2"/></svg></span><span>隐患排查治理</span></button>
<button class="app-link original-app" type="button" data-original-app="物联网监测"><span class="app-icon" style="--app-color:#6654f7;background:linear-gradient(155deg,color-mix(in srgb,#6654f7,white 25%),#6654f7)"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><circle cx="16" cy="16" r="11" stroke="currentColor" stroke-width="2"/><path d="M5 16h22M8 9c5 4 11 4 16 0M8 23c5-4 11-4 16 0M16 5c-6 7-6 15 0 22 6-7 6-15 0-22Z" stroke="currentColor" stroke-width="2"/></svg></span><span>物联网监测</span></button>
<button class="app-link original-app" type="button" data-original-app="消控室管理"><span class="app-icon" style="--app-color:#ef2f4f;background:linear-gradient(155deg,color-mix(in srgb,#ef2f4f,white 25%),#ef2f4f)"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><rect x="5" y="7" width="22" height="22" rx="2" stroke="currentColor" stroke-width="2.5"/><path d="M10 3v8M22 3v8M5 14h22M10 19h3m6 0h3m-12 5h3m6 0h3" stroke="currentColor" stroke-width="2.5"/></svg></span><span>消控室管理</span></button>
<button class="app-link original-app" type="button" data-original-app="承包商管理"><span class="app-icon" style="--app-color:#0879ff;background:linear-gradient(155deg,color-mix(in srgb,#0879ff,white 25%),#0879ff)"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M12 4h8v7h-8zM4 23h7v6H4zm17 0h7v6h-7zM12 23h8v6h-8z" fill="currentColor"/><path d="M16 11v7M7 23v-5h18v5M16 18v5" stroke="currentColor" stroke-width="3"/></svg></span><span>承包商管理</span></button>
<button class="app-link original-app" type="button" data-original-app="安全作业管理"><span class="app-icon" style="--app-color:#83b721;background:linear-gradient(155deg,color-mix(in srgb,#83b721,white 25%),#83b721)"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M8 8h16v21l-8-4-8 4V8Z" fill="currentColor"/><rect x="5" y="3" width="22" height="7" rx="1" stroke="currentColor" stroke-width="2"/></svg></span><span>安全作业管理</span></button>
<button class="app-link original-app" type="button" data-original-app="应急管理"><span class="app-icon" style="--app-color:#e43d3d;background:linear-gradient(155deg,color-mix(in srgb,#e43d3d,white 25%),#e43d3d)"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M5 23V5h21v15M3 26h16" stroke="currentColor" stroke-width="2.5"/><path d="m24 15 7 14H17l7-14Z" fill="currentColor"/><path d="M24 20v4m0 2v1" stroke="#e43d3d" stroke-width="2"/></svg></span><span>应急管理</span></button>
<button class="app-link original-app" type="button" data-original-app="视频监测"><span class="app-icon" style="--app-color:#12a36a;background:linear-gradient(155deg,color-mix(in srgb,#12a36a,white 25%),#12a36a)"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="m5 6 22 10-5 9L2 14 5 6Z" fill="currentColor"/><path d="M9 19v7h12M5 17v12" stroke="currentColor" stroke-width="2.5"/></svg></span><span>视频监测</span></button>
<button class="app-link original-app" type="button" data-original-app="现场管理"><span class="app-icon" style="--app-color:#eaa11a;background:linear-gradient(155deg,color-mix(in srgb,#eaa11a,white 25%),#eaa11a)"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><rect x="5" y="5" width="22" height="9" rx="2" fill="currentColor"/><rect x="5" y="19" width="22" height="9" rx="2" fill="currentColor"/></svg></span><span>现场管理</span></button>
<button class="app-link original-app" type="button" data-original-app="承租方管理"><span class="app-icon" style="--app-color:#c5ad00;background:linear-gradient(155deg,color-mix(in srgb,#c5ad00,white 25%),#c5ad00)"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><rect x="6" y="7" width="20" height="23" rx="2" fill="currentColor"/><path d="M12 8V3h8v5" stroke="currentColor" stroke-width="2"/><text x="16" y="24" text-anchor="middle" font-size="17" fill="#c5ad00">租</text></svg></span><span>承租方管理</span></button>
<button class="app-link original-app" type="button" data-original-app="事故案例库"><span class="app-icon" style="--app-color:#ef2f4f;background:linear-gradient(155deg,color-mix(in srgb,#ef2f4f,white 25%),#ef2f4f)"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M12 4h8l6 24H6L12 4Z" fill="currentColor"/><path d="M10 12h12M8 19h16" stroke="#ef2f4f" stroke-width="2"/></svg></span><span>事故案例库</span></button>
<button class="app-link original-app" type="button" data-original-app="规章制度库"><span class="app-icon" style="--app-color:#b349ce;background:linear-gradient(155deg,color-mix(in srgb,#b349ce,white 25%),#b349ce)"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><rect x="6" y="3" width="20" height="27" rx="3" fill="currentColor"/><path d="M11 10h10M11 16h10M11 22h7" stroke="#b349ce" stroke-width="2.5"/></svg></span><span>规章制度库</span></button>
<button class="app-link original-app" type="button" data-original-app="视频智能巡检"><span class="app-icon" style="--app-color:#16b5a4;background:linear-gradient(155deg,color-mix(in srgb,#16b5a4,white 25%),#16b5a4)"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M16 3a9 9 0 0 0-9 9c0 7 9 16 9 16s9-9 9-16a9 9 0 0 0-9-9Z" fill="currentColor"/><circle cx="16" cy="12" r="3" fill="#16b5a4"/></svg></span><span>视频智能巡检</span></button>
<button class="app-link original-app" type="button" data-original-app="安全会议"><span class="app-icon" style="--app-color:#3d8fff;background:linear-gradient(155deg,color-mix(in srgb,#3d8fff,white 25%),#3d8fff)"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><circle cx="16" cy="10" r="5" fill="currentColor"/><path d="M7 27v-4a9 9 0 0 1 18 0v4H7Z" fill="currentColor"/><path d="M7 7a4 4 0 0 0 0 8M25 7a4 4 0 0 1 0 8M2 26v-5c0-3 2-5 5-5M30 26v-5c0-3-2-5-5-5" stroke="currentColor" stroke-width="2"/></svg></span><span>安全会议</span></button>
<a class="app-link" href="绿十字管理移动端.html"><span class="app-icon green"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M12 4h8v8h8v8h-8v8h-8v-8H4v-8h8V4Z" fill="currentColor"/></svg></span><span>绿十字管理</span></a>
<a class="app-link" href="访客管理移动端.html"><span class="app-icon"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><rect x="5" y="7" width="22" height="21" rx="3" stroke="currentColor" stroke-width="2"/><path d="M12 7V4h8v3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="16" cy="14" r="3" fill="currentColor"/><path d="M10 24v-2a6 6 0 0 1 12 0v2" fill="currentColor"/></svg></span><span>访客管理</span></a>
</nav></section>
</main>
</div>
<nav class="bottom-nav" aria-label="主导航"><button type="button" data-original-app="首页"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m3 11 9-8 9 8M5 10v11h14V10M9 21v-7h6v7" stroke="currentColor" stroke-width="2"/></svg>首页</button><button type="button" class="active" aria-current="page"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m12 2 10 5v10l-10 5-10-5V7l10-5Z" fill="currentColor"/><path d="m5 7 7 4 7-4M12 11v8" stroke="white" stroke-width="2"/></svg>工作台</button><button type="button" data-original-app="我的"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="7" r="4" fill="currentColor"/><path d="M4 22v-3a8 8 0 0 1 16 0v3H4Z" fill="currentColor"/></svg>我的</button></nav><div class="toast" id="toast" role="status" hidden></div><script>let toastTimer;document.querySelectorAll('[data-original-app]').forEach(button=>button.onclick=()=>{const toast=document.getElementById('toast');toast.textContent=button.dataset.originalApp+'暂未接入页面';toast.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.hidden=true,2000)});</script><script src="prototype-annotations-data.js"></script>
