<body class="admin-page" data-view="admin">
  <div class="admin-shell">
    <aside class="admin-sidebar"><div class="admin-brand"><span class="brand-logo">访</span><span><strong>安全生产系统</strong><small>来宾广投新材料</small></span></div><nav><a class="active" href="visitor-admin.html">访客管理</a><a href="#parameters" id="parameters-menu">参数配置</a><a href="visitor.html">访客端预览</a></nav><p>静态交互原型<br>数据保存在当前浏览器</p></aside>
    <div class="admin-main"><header class="admin-topbar"><span>安全生产 / <b>访客管理</b></span><div class="role-switch" role="group" aria-label="演示角色"><button class="active" data-role="reception" type="button">接待人员</button><button data-role="guard" type="button">门卫</button></div></header>
      <main class="admin-content"><div class="admin-heading"><div><h1>访客管理</h1><p id="role-caption">审核分配给您的来访申请</p></div><button class="btn soft" id="reset-data" type="button">重置演示数据</button></div>
        <section class="metric-row" id="visitor-metrics"></section>
        <section class="ledger-panel"><div class="visit-time-tabs" id="visit-time-tabs" data-scope="today" role="tablist" aria-label="到访日期"><button type="button" role="tab" id="visit-tab-today" aria-controls="visit-results" aria-selected="true" class="active" data-time-scope="today">今日到访</button><button type="button" role="tab" id="visit-tab-all" aria-controls="visit-results" aria-selected="false" tabindex="-1" data-time-scope="all">全部</button></div><div id="visit-results" role="tabpanel" aria-labelledby="visit-tab-today"><div class="filters"><label><span>申请状态</span><select id="status-filter"><option value="all">全部申请状态</option><option>待审核</option><option value="已通过">已审核</option><option>已驳回</option><option>已过期</option></select></label><label><span>场内状态</span><select id="presence-filter"><option value="all">全部场内状态</option><option value="未进场">未进场</option><option value="inside">当前场内</option><option value="overdue">超期在场</option><option value="outside">已离场</option></select></label><label class="search"><span>关键词</span><input id="keyword-filter" type="search" placeholder="姓名、单位、编号、车牌"></label><span id="result-count"></span></div>
          <div class="table-wrap"><table><thead><tr><th>申请编号</th><th>访客 / 单位</th><th>访客类型</th><th>来访车辆</th><th>接待人 / 部门班组</th><th>有效期</th><th>预计到达</th><th>创建时间</th><th>申请状态</th><th>场内状态</th><th>操作</th></tr></thead><tbody id="visitor-tbody"></tbody></table><div id="admin-empty" class="empty-state" hidden><span>◇</span><strong>暂无符合条件的访客申请</strong><small>请调整筛选条件后重试</small></div></div>
          <div class="pagination"><span>每页 10 条</span><button class="active" type="button">1</button></div>
        </div></section>
      </main>
    </div>
  </div>
  <div id="admin-overlay"></div><div id="visitor-toast" class="toast" role="status" aria-live="polite"></div>

  <script data-source="visitor.js">
const STORE='gt-visitor-demo-v1';
const now=()=>new Date();
const pad=n=>String(n).padStart(2,'0');
const localDateTime=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
const dateOnly=d=>localDateTime(d).slice(0,10);
const fmt=v=>v?String(v).replace('T',' '):'—';
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const addDays=(n,h=9,m=30)=>{const d=now();d.setDate(d.getDate()+n);d.setHours(h,m,0,0);return d};
const seed=()=>({auth:false,apps:[
  {id:'LF20261009001',openid:'wx_demo_001',company:'柳州智造设备有限公司',location:'生产区域',purpose:'设备维护与技术交流',hostName:'韦宝亭',hostPhone4:'3707',startDate:dateOnly(now()),endDate:dateOnly(addDays(2)),expectedAt:localDateTime(addDays(0,9,30)),contactName:'周达广',contactPhone:'13768473707',idNumber:'452226197510233616',photos:2,visitors:['李明'],vehicles:[{plate:'桂B·A7810',origin:'柳州'}],status:'待审核',createdAt:localDateTime(addDays(0,8,40)),approval:null,gates:[],refusals:[],notifications:[{text:'已通过企业微信通知接待人',time:localDateTime(addDays(0,8,41))}]},
  {id:'LF20261008006',openid:'wx_demo_001',company:'广西恒安物流有限公司',location:'仓储区域',purpose:'送货',hostName:'韦宝亭',hostPhone4:'3707',startDate:dateOnly(addDays(-1)),endDate:dateOnly(addDays(1)),expectedAt:localDateTime(addDays(-1,10,0)),contactName:'陈晓峰',contactPhone:'13800001122',idNumber:'452201198804123519',photos:3,visitors:[],vehicles:[{plate:'桂G·6K921',origin:'来宾'}],status:'已通过',createdAt:localDateTime(addDays(-1,8,30)),approval:{result:'同意',by:'韦宝亭',time:localDateTime(addDays(-1,8,55))},gates:[{in:localDateTime(addDays(-1,9,58)),out:localDateTime(addDays(-1,11,42)),source:'当前时间',by:'门卫 王师傅',edits:[]}],refusals:[],notifications:[{text:'审核通过短信已发送',time:localDateTime(addDays(-1,8,56))}]},
  {id:'LF20261007003',openid:'wx_demo_002',company:'南宁环保技术有限公司',location:'环保站',purpose:'现场检测',hostName:'黄工',hostPhone4:'6621',startDate:dateOnly(addDays(-2)),endDate:dateOnly(addDays(-1)),expectedAt:localDateTime(addDays(-2,14,0)),contactName:'林江',contactPhone:'13900002233',idNumber:'450103199203087418',photos:2,visitors:[],vehicles:[],status:'已驳回',createdAt:localDateTime(addDays(-2,11,5)),approval:{result:'驳回',reason:'请补充检测设备清单后重新申请',by:'黄工',time:localDateTime(addDays(-2,11,30))},gates:[],refusals:[],notifications:[]}
]});
const seedBase=seed;
function extraVisitRows(){const base=seedBase().apps[0];return [
{...base,id:'LF-DEMO-APPROVED-ENTRY',contactName:'张建华',company:'柳州设备服务有限公司',status:'已通过',hostDepartment:'综合管理部',hostTeam:'',approval:{result:'同意',by:'韦宝亭',time:localDateTime(addDays(0,8,50))},gates:[],notifications:[],vehicles:[{plate:'桂B·K3826',origin:'柳州'}]},
{...base,id:'LF-DEMO-APPROVED-INSIDE',contactName:'李志强',company:'来宾机电设备有限公司',status:'已通过',hostDepartment:'综合管理部',hostTeam:'',approval:{result:'同意',by:'韦宝亭',time:localDateTime(addDays(0,8,20))},gates:[{in:localDateTime(now()),out:null,source:'门岗当前时间',enterBy:'门卫 王师傅',edits:[]}],notifications:[],vehicles:[{plate:'桂G·M5628',origin:'来宾'}]}
]}
function multiVehicleExample(){return {...extraVisitRows()[0],id:'LF-DEMO-MULTI-VEHICLE',contactName:'王启明',company:'多车辆来访演示单位',visitors:[],vehicles:[{plate:'桂B·A7810',origin:'柳州'},{plate:'桂G·6K921',origin:'来宾'},{plate:'桂A·D2608',origin:'南宁'}]}}
const seedWithExamples=()=>{const data=seedBase();data.apps.splice(1,0,...extraVisitRows(),multiVehicleExample());return data};
let db=JSON.parse(localStorage.getItem(STORE)||'null')||seedWithExamples();
if(!db.approvedPresenceExamples){for(const a of extraVisitRows())if(!db.apps.some(x=>x.id===a.id))db.apps.push(a);db.approvedPresenceExamples=true;localStorage.setItem(STORE,JSON.stringify(db))}
if(!db.multiVehicleExampleAdded){if(!db.apps.some(a=>a.id==='LF-DEMO-MULTI-VEHICLE'))db.apps.unshift(multiVehicleExample());db.multiVehicleExampleAdded=true;localStorage.setItem(STORE,JSON.stringify(db))}
const save=()=>localStorage.setItem(STORE,JSON.stringify(db));
const toast=msg=>{const el=document.getElementById('visitor-toast');if(!el)return;el.textContent=msg;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2200)};
const statusClass=s=>s==='已通过'?'green':s==='待审核'?'orange':s==='已驳回'?'red':'gray';
const presence=a=>{const last=a.gates.at(-1);if(last&&!last.out)return new Date(a.endDate+'T23:59')<now()?'超期在场':'已进场';if(last)return'已离场';return'未进场'};
const personCanCancel=a=>!a.gates.length&&['待审核','已通过'].includes(a.status);

function hostOrg(a){return [a.hostDepartment?.replace(/（.*?）|\(.*?\)/g,'')||(a.hostName==='韦宝亭'?'综合管理部':''),a.hostTeam].filter(Boolean).join(' / ')||'部门未录入'}
function entryLabel(a){const p=presence(a);return p==='已进场'?'当前场内':p}
function approvalLabel(a){return a.status==='已通过'?'已审核':a.status}
function matchesStatus(a,s){return s==='all'||a.status===s||(s==='未进场'&&presence(a)==='未进场')||(s==='pending-entry'&&a.status==='待审核'&&presence(a)==='未进场')||(s==='approved-entry'&&a.status==='已通过'&&presence(a)==='未进场')||(s==='inside'&&['已进场','超期在场'].includes(presence(a)))||(s==='overdue'&&presence(a)==='超期在场')||(s==='outside'&&presence(a)==='已离场')}
function entryAllowed(a,time=now()){const day=dateOnly(time);return a.status==='已通过'&&day>=a.startDate&&day<=a.endDate&&!['已进场','超期在场'].includes(presence(a))}

if(document.body.dataset.view==='visitor') initVisitor();
if(document.body.dataset.view==='admin') initAdmin();

function initVisitor(){
  const auth=document.getElementById('auth-screen'),app=document.getElementById('visitor-app'),err=document.getElementById('auth-error');
  const enter=()=>{db.auth=true;save();auth.hidden=true;app.hidden=false;setupForm();renderMine()};
  document.getElementById('wechat-auth').onclick=enter;document.getElementById('reauth').onclick=enter;
  document.getElementById('auth-deny').onclick=()=>{err.hidden=false;toast('授权未完成，请重新授权')};
  if(db.auth||new URLSearchParams(location.search).get('authorized')==='1')enter();
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));
  document.querySelector('.mobile-tabs').onkeydown=e=>{if(!['ArrowLeft','ArrowRight'].includes(e.key))return;e.preventDefault();const next=e.key==='ArrowRight'?'mine':'apply';switchTab(next);document.querySelector(`.mobile-tabs [data-tab="${next}"]`).focus()};
  document.getElementById('add-visitor').onclick=addVisitor;
  document.getElementById('add-vehicle').onclick=addVehicle;
  document.getElementById('match-host').onclick=matchHost;
  document.getElementById('visit-form').addEventListener('submit',submitApplication);
  document.addEventListener('change',e=>{if(e.target.matches('input[type=file]'))previewUpload(e.target)});
}
function switchTab(tab){document.getElementById('tab-apply').hidden=tab!=='apply';document.getElementById('tab-mine').hidden=tab!=='mine';document.querySelectorAll('[data-tab]').forEach(b=>{const on=b.dataset.tab===tab;b.classList.toggle('active',on);if(b.closest('.mobile-tabs'))b.setAttribute('aria-selected',String(on))});if(tab==='mine')renderMine()}
function setupForm(){const f=document.getElementById('visit-form');if(f.dataset.ready)return;const d=now(),later=addDays(1);f.startDate.value=dateOnly(d);f.endDate.value=dateOnly(later);f.expectedAt.value=localDateTime(d);f.startDate.min=dateOnly(d);f.endDate.min=dateOnly(d);f.dataset.ready='1'}
function matchHost(){const f=document.getElementById('visit-form'),out=document.getElementById('host-result');const ok=f.hostName.value.trim()==='韦宝亭'&&f.hostPhone4.value==='3707';f.dataset.hostMatched=ok?'1':'';out.className='field-tip '+(ok?'ok':'error');out.textContent=ok?'已匹配：韦宝亭 · 综合管理部（宣传部）':'未匹配到接待人，请核对姓名与手机号后四位';}
function addVisitor(name=''){const box=document.createElement('div');box.className='repeat-card';box.innerHTML=`<div class="repeat-title"><strong>同行人</strong><button class="remove-btn" type="button">删除</button></div><label class="field"><span>姓名 <b>*</b></span><input class="companion-name" required maxlength="30" value="${esc(name)}" placeholder="请输入同行人姓名"></label>`;box.querySelector('button').onclick=()=>box.remove();document.getElementById('visitor-list').append(box)}
function addVehicle(v={}){const root=document.getElementById('vehicle-list');root.querySelector('.empty-inline')?.remove();const box=document.createElement('div');box.className='repeat-card vehicle-card';box.innerHTML=`<div class="repeat-title"><strong>车辆</strong><button class="remove-btn" type="button">删除</button></div><div class="field-grid"><label class="field"><span>车牌号码 <b>*</b></span><input class="vehicle-plate" required value="${esc(v.plate||'')}" placeholder="如：桂G·12345"></label><label class="field"><span>车辆来源地 <b>*</b></span><input class="vehicle-origin" required value="${esc(v.origin||'')}" placeholder="请输入来源地"></label><label class="upload field full"><span>相关信息照片</span><input type="file" accept="image/*"><span class="upload-box">＋ 上传车辆照片</span></label></div>`;box.querySelector('.remove-btn').onclick=()=>{box.remove();if(!root.children.length)root.innerHTML='<p class="empty-inline">如驾车来访，请添加车辆</p>'};root.append(box)}
function previewUpload(input){const box=input.nextElementSibling,file=input.files[0];if(!file)return;const url=URL.createObjectURL(file);box.innerHTML=`<img src="${url}" alt="已上传图片预览">`;}
function submitApplication(e){e.preventDefault();const f=e.currentTarget;if(!f.reportValidity())return;if(f.dataset.hostMatched!=='1'){toast('请先验证接待人');return}const start=new Date(f.startDate.value),end=new Date(f.endDate.value);if(end<start||end-start>30*864e5){toast('有效期应为开始日起30天内');return}const btn=f.querySelector('[type=submit]');btn.disabled=true;btn.textContent='正在提交…';setTimeout(()=>{const fd=new FormData(f),id='LF'+dateOnly(now()).replaceAll('-','')+String(db.apps.length+1).padStart(3,'0');db.apps.unshift({id,openid:'wx_demo_001',company:fd.get('company'),location:fd.get('location'),purpose:fd.get('purpose'),hostName:fd.get('hostName'),hostPhone4:fd.get('hostPhone4'),startDate:fd.get('startDate'),endDate:fd.get('endDate'),expectedAt:fd.get('expectedAt'),contactName:fd.get('contactName'),contactPhone:fd.get('contactPhone'),idNumber:fd.get('idNumber'),photos:2,visitors:[...document.querySelectorAll('.companion-name')].map(x=>x.value),vehicles:[...document.querySelectorAll('.vehicle-card')].map(x=>({plate:x.querySelector('.vehicle-plate').value,origin:x.querySelector('.vehicle-origin').value})),status:'待审核',createdAt:localDateTime(now()),approval:null,gates:[],refusals:[],notifications:[{text:'已通过企业微信通知接待人',time:localDateTime(now())}]});save();btn.disabled=false;btn.textContent='提交预约';toast('预约已提交，已通知接待人');switchTab('mine')},650)}
function renderMine(){const apps=db.apps.filter(a=>a.openid==='wx_demo_001'),root=document.getElementById('booking-list');document.getElementById('mine-count').textContent=apps.length?apps.length:'';root.innerHTML=apps.length?apps.map(a=>`<article class="booking-card"><div class="booking-top"><strong>${esc(a.company)}</strong><span class="status ${statusClass(a.status)}"${a.status==='已驳回'?` title="${esc('驳回原因：'+(a.approval?.reason||'未记录驳回原因'))}"`: ""}>${approvalLabel(a)}</span></div><div class="booking-meta"><span>${esc(a.id)}</span><span>${fmt(a.expectedAt)}</span></div><div class="booking-actions"><button class="btn soft" data-detail="${a.id}" type="button">查看详情</button>${a.status==='已驳回'?`<button class="btn primary" data-copy="${a.id}" type="button">复制申请</button>`:''}</div></article>`).join(''):'<div class="empty-inline">暂无预约记录</div>';root.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>showMobileDetail(b.dataset.detail));root.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copyApplication(b.dataset.copy))}
function showMobileDetail(id){const a=db.apps.find(x=>x.id===id),root=document.getElementById('modal-root');const events=[{text:'提交申请',time:a.createdAt},...(a.approval?[{text:a.approval.result+(a.approval.reason?'：'+a.approval.reason:''),time:a.approval.time}]:[]),...a.gates.flatMap(g=>[{text:'登记进场',time:g.in},...(g.out?[{text:'登记出场',time:g.out}]:[])])];root.innerHTML=`<section class="detail-sheet"><header class="sheet-head"><button id="close-sheet" type="button">‹</button><h2>预约详情</h2></header><div class="detail-body"><section class="detail-section"><div class="booking-top"><strong>${esc(a.company)}</strong><span class="status ${statusClass(a.status)}"${a.status==='已驳回'?` title="${esc('驳回原因：'+(a.approval?.reason||'未记录驳回原因'))}"`: ""}>${approvalLabel(a)}</span></div></section><section class="detail-section"><h3>基本信息</h3>${[['申请编号',a.id],['主联系人',a.contactName],['身份证号','**************'+a.idNumber.slice(-4)],['证件照片','已上传'],['同行人员',a.visitors.join('、')||'无'],['车辆',a.vehicles.map(v=>v.plate).join('、')||'无'],['到访地点',a.location],['预计到达',fmt(a.expectedAt)],['场内状态',entryLabel(a)]].map(([k,v])=>`<div class="detail-row"><span>${k}</span><b>${esc(v)}</b></div>`).join('')}</section><section class="detail-section"><h3>办理记录</h3><div class="timeline">${events.map(x=>`<div class="timeline-item"><strong>${esc(x.text)}</strong><small>${fmt(x.time)}</small></div>`).join('')}</div></section>${personCanCancel(a)?'<button class="btn danger wide" id="cancel-app" type="button">取消预约</button>':''}</div></section>`;document.getElementById('close-sheet').onclick=()=>root.innerHTML='';document.getElementById('cancel-app')?.addEventListener('click',()=>{a.status='已取消';a.notifications.push({text:'取消结果短信已发送',time:localDateTime(now())});save();root.innerHTML='';renderMine();toast('预约已取消')})}
function copyApplication(id){const a=db.apps.find(x=>x.id===id),f=document.getElementById('visit-form');switchTab('apply');f.company.value=a.company;f.location.value=a.location;f.purpose.value=a.purpose;f.hostName.value=a.hostName;f.hostPhone4.value=a.hostPhone4;f.contactName.value=a.contactName;f.contactPhone.value=a.contactPhone;f.dataset.hostMatched='1';document.getElementById('host-result').className='field-tip ok';document.getElementById('host-result').textContent='已匹配：'+a.hostName;toast('已复制非敏感信息，请补充证件资料')}

function initAdmin(){let role='reception';const render=()=>renderAdmin(role);document.querySelectorAll('[data-role]').forEach((b,i)=>{b.setAttribute('aria-pressed',String(i===0));b.onclick=()=>{role=b.dataset.role;document.querySelectorAll('[data-role]').forEach(x=>{const on=x===b;x.classList.toggle('active',on);x.setAttribute('aria-pressed',String(on))});document.getElementById('role-caption').textContent=role==='reception'?'审核分配给您的来访申请':'核验已通过申请并登记进出时间';render()}});document.getElementById('status-filter').onchange=render;document.getElementById('presence-filter').onchange=render;document.getElementById('keyword-filter').oninput=render;document.getElementById('reset-data').onclick=()=>{db=seedWithExamples();db.approvedPresenceExamples=true;save();render();toast('演示数据已重置')};render()}

const gateDialogReviewed=(a,type,role)=>{if(role!=='guard')return toast('请由门卫登记进出场');if(type==='enter'&&!entryAllowed(a))return toast('申请未审核通过、不在有效期内或当前已在场');if(type==='exit'&&!['已进场','超期在场'].includes(presence(a)))return toast('当前没有待出场记录');const expected=new Date(a.expectedAt),same=!a.gates.length&&dateOnly(expected)===dateOnly(now()),initial=type==='enter'?(same?a.expectedAt:localDateTime(now())):localDateTime(now()),source=same&&type==='enter'?'访客填写的预计到达时间':'门岗当前时间';dialog(`<h2>${type==='enter'?'登记进场':'登记出场'}</h2><div class="gate-form"><div class="gate-summary"><div class="gate-summary-head"><span class="gate-visitor">${esc(a.contactName)}</span><span class="status blue">${entryLabel(a)}</span></div><div class="gate-company">${esc(a.company)}</div><div class="gate-summary-grid"><div><span>有效期</span><b>${a.startDate} 至 ${a.endDate}</b></div><div><span>本次登记</span><b>第 ${type==='enter'?a.gates.length+1:a.gates.length} 次${type==='enter'?'进场':'出场'}</b></div></div></div><div class="gate-time-heading"><label for="gate-time">${type==='enter'?'进场':'出场'}时间</label>${type==='enter'?'<button class="text-btn" id="use-now" type="button">更新为当前时间</button>':''}</div><input id="gate-time" type="datetime-local" value="${initial}"><div class="source-note" id="source-note">时间来源：${source}</div><label class="gate-verification"><input id="verified" type="checkbox"><span>已核验现场证件与主联系人信息一致</span></label></div><div class="dialog-actions gate-actions"><button class="btn soft" id="cancel-gate" type="button">取消</button><button class="btn primary" id="confirm-gate">确认${type==='enter'?'进场':'出场'}</button></div>`,root=>{root.querySelector('#cancel-gate').onclick=()=>root.remove();root.querySelector('#use-now')?.addEventListener('click',()=>{root.querySelector('#gate-time').value=localDateTime(now());root.querySelector('#source-note').textContent='时间来源：门岗当前时间'});root.querySelector('#confirm-gate').onclick=()=>{if(!root.querySelector('#verified').checked)return toast('请先确认已完成证件核验');const time=root.querySelector('#gate-time').value,g=a.gates.at(-1),stamp=new Date(time);if(!time||Number.isNaN(stamp.getTime()))return toast('请填写有效的登记时间');if(type==='enter'&&(!entryAllowed(a)||!entryAllowed(a,stamp)))return toast('仅限已审核且在有效期内登记进场');if(type==='enter'&&g?.out&&stamp<new Date(g.out))return toast('再次进场时间不能早于上次出场时间');if(type==='exit'&&(!g||g.out||stamp<new Date(g.in)))return toast('出场时间不能早于本次进场时间，且不可重复出场');if(type==='enter')a.gates.push({in:time,out:null,source:root.querySelector('#source-note').textContent.replace('时间来源：',''),enterBy:'门卫 王师傅'});else{g.out=time;g.exitBy='门卫 李师傅'}save();root.remove();renderAdmin(role);toast(type==='enter'?'已登记进场':'已登记出场')}})};
gateDialog=gateDialogReviewed;
if(document.body.dataset.view==='admin')renderAdmin('reception');
function initVisitTimeTabs(){const tabs=document.getElementById('visit-time-tabs'),buttons=Array.from(tabs.querySelectorAll('[data-time-scope]'));const select=button=>{tabs.dataset.scope=button.dataset.timeScope;buttons.forEach(b=>{const selected=b===button;b.classList.toggle('active',selected);b.setAttribute('aria-selected',String(selected));b.tabIndex=selected?0:-1});document.getElementById('visit-results').setAttribute('aria-labelledby',button.id);document.getElementById('status-filter').dispatchEvent(new Event('change'))};buttons.forEach((button,index)=>{button.onclick=()=>select(button);button.onkeydown=e=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const next=e.key==='Home'?buttons[0]:e.key==='End'?buttons.at(-1):buttons[(index+1)%buttons.length];select(next);next.focus()}}});document.addEventListener('visibilitychange',()=>{if(!document.hidden)document.getElementById('status-filter').dispatchEvent(new Event('change'))})}
if(document.body.dataset.view==='admin')initVisitTimeTabs();
