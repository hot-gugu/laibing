function auditTimelineEntries(r){

 if(entries.length===2)return entries.sort((a,b)=>String(b.time||'').localeCompare(String(a.time||''))||b.index-a.index);
 }

 const kinds=[{id:'first-pass',name:'初审',pending:'待一审'},{id:'second-pass',name:'复审',pending:'待二审'},{id:'first-reject',name:'初审'},{id:'second-reject',name:'复审'}];
 const events=(r.logs||[]).flatMap((log,index)=>{const action=String(log.action||'');let id;if(/(一级|初审).*(不通过|驳回|拒绝)/.test(action))id='first-reject';else if(/(二级|复审).*(不通过|驳回|拒绝)/.test(action))id='second-reject';else if(/(一级|初审).*通过/.test(action))id='first-pass';else if(/(二级|复审).*通过/.test(action))id='second-pass';if(!id)return [];return [{...log,id,name:kinds.find(k=>k.id===id).name,status:log.assessment||(id.endsWith('reject')?'未通过':'已通过'),index}]});
