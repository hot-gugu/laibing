<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>隐患计划管理</title><style>
:root{--primary:#0879ff;--ink:#24344d;--muted:#8190a5;--line:rgba(190,211,238,.95);--prod-surface-card-surface:radial-gradient(circle at 100% 0,rgba(8,121,255,.045),transparent 48%),linear-gradient(145deg,#fff,#f7fbff)}*{box-sizing:border-box}body{margin:0;font:14px/1.6 "Microsoft YaHei",sans-serif;color:var(--ink);background:#edf3fc}button,input{font:inherit}button{cursor:pointer;font-weight:400}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,input:focus-visible{outline:2px solid #a9c9ff;outline-offset:2px}header{height:68px;background:#252940;color:white;display:flex;align-items:center;justify-content:space-between;padding:0 26px}.brand{font-size:22px;font-weight:600;display:flex;align-items:center;gap:12px}.shield{width:35px;height:40px;display:grid;place-items:center;background:linear-gradient(150deg,#0879ff,#6654f7);clip-path:polygon(50% 0,96% 18%,88% 72%,50% 100%,12% 72%,4% 18%);font-size:23px}.account{display:flex;align-items:center;gap:10px;font-size:12px}.avatar{background:#0879ff;border-radius:50%;width:36px;height:36px;display:grid;place-items:center}.layout{display:flex;min-height:calc(100vh - 68px)}aside{background:#252940;width:210px;flex:none;padding:16px 10px;color:#fff}.nav-title{font-size:12px;padding:0 12px 15px;color:#aebbd3}.nav-item{display:flex;align-items:center;gap:12px;min-height:46px;border-radius:6px;padding:0 14px;margin:3px 0}.nav-item.active{background:linear-gradient(100deg,#0879ff,#6654f7)}.nav-icon{font-size:18px;width:20px;text-align:center}main{padding:20px 24px;flex:1;min-width:0}.breadcrumb{color:var(--muted);font-size:12px;margin-bottom:14px}.breadcrumb span{color:var(--ink)}.page-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}h1{font-size:22px;font-weight:600;margin:0;color:#172033}.btn{height:36px;padding:0 16px;border:1px solid #d8e2ef;border-radius:8px;background:#fff;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:6px}.btn:hover{border-color:#a9c9ff;background:#eef6ff}.primary{border:0;background:linear-gradient(100deg,#0879ff,#6654f7);color:white}.primary:hover{background:linear-gradient(100deg,#3d8fff,#6654f7);color:#fff}.blue{color:var(--primary);border-color:#cfe1ff;background:#eef6ff}.danger{color:#ef2f4f;background:#fff4f5;border-color:#ef2f4f;height:30px;border-radius:6px;padding:0 12px}.panel{background:rgba(247,251,255,.92);border:1px solid rgba(207,219,236,.78);border-radius:12px;padding:14px;box-shadow:0 10px 26px rgba(44,88,148,.1);min-height:calc(100vh - 185px)}.tabs{display:inline-flex;padding:4px;border:1px solid var(--line);border-radius:8px;background:white;gap:4px;margin-bottom:18px}.tabs button{border:0;background:transparent;color:var(--ink);height:36px;padding:0 22px;border-radius:6px}.tabs button.active{background:linear-gradient(100deg,#0879ff,#6654f7);color:white}.section{margin-bottom:22px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;min-height:36px}.section-title{font-size:16px;color:#172033;font-weight:400;margin:0;display:flex;align-items:center;gap:9px}.section-title:before{content:"";height:18px;width:4px;border-radius:999px;background:linear-gradient(180deg,#0879ff,#6a4df5)}.info{border:1px solid var(--line);border-radius:8px;background:var(--prod-surface-card-surface);padding:22px 20px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px 26px;box-shadow:0 8px 20px rgba(45,87,140,.06)}.field{display:flex;gap:12px;align-items:baseline}.field .label{color:var(--muted);min-width:98px;flex:none}.wide{grid-column:1/-1}.pill{display:inline-flex;height:22px;padding:0 10px;border-radius:999px;font-size:12px;background:#eef6ff;color:#0879ff}.pill.gray{background:#edf1f6;color:#8190a5}.link{border:0;background:none;padding:0;color:var(--primary)}.actions{display:flex;gap:10px}.table-wrap{border:1px solid var(--line);border-radius:8px;overflow:auto;background:white}table{border-collapse:collapse;width:100%;white-space:nowrap;text-align:left}th{font-weight:400;background:#eef6ff;color:#526b91;border-bottom:1px solid #dce8f7;padding:13px 18px}td{padding:17px 18px;border-bottom:1px solid #e7eef8}tr:last-child td{border-bottom:0}th:first-child,td:first-child{padding-left:20px}.num{width:80px}.radio{display:inline-flex;gap:7px;align-items:center;margin-right:18px;cursor:pointer}input[type=checkbox],input[type=radio]{accent-color:var(--primary);width:15px;height:15px;margin:0;vertical-align:middle}.summary{font-size:12px;color:var(--muted);margin-top:10px}.subline{display:flex;gap:10px;margin:0 0 16px}.subline span{color:var(--muted)}.overlay{position:fixed;inset:0;background:rgba(23,32,51,.35);display:flex;align-items:center;justify-content:center;z-index:20;padding:24px}.overlay[hidden]{display:none}.modal{width:min(1120px,100%);height:min(780px,calc(100dvh - 48px));background:#fff;border-radius:12px;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(23,32,51,.18);overflow:hidden}.modal-head{padding:18px 22px;border-bottom:1px solid #e7eef8;display:flex;align-items:center;justify-content:space-between}.modal-head h2{font-size:16px;font-weight:400;margin:0;color:#172033}.close{border:0;background:none;font-size:24px;color:var(--muted);width:32px;height:32px}.selected{padding:16px 20px;display:flex;gap:8px;align-items:flex-start;min-height:65px}.selected-label{padding-top:4px;white-space:nowrap}.chips{display:flex;gap:7px;flex-wrap:wrap;max-height:90px;overflow:auto}.chip{font-size:12px;color:var(--primary);background:#eef6ff;border:1px solid #cfe1ff;border-radius:6px;padding:3px 8px}.chip button{border:0;color:var(--primary);background:none;padding:0 0 0 6px}.selector{display:grid;grid-template-columns:280px minmax(0,1fr);gap:14px;flex:1;min-height:0;padding:0 20px 18px}.tree-panel,.people-panel{border:1px solid var(--line);border-radius:8px;min-height:0;display:flex;flex-direction:column;overflow:hidden}.search-bar{padding:12px;display:flex;justify-content:flex-end}.search{height:36px;width:100%;border:1px solid #d8e2ef;border-radius:8px;padding:0 11px;color:var(--ink);background:#fff}.people-panel .search{max-width:270px}.tree-caption{background:#eef6ff;padding:9px 12px}.tree{overflow:auto;padding:7px;flex:1}.tree-node{width:100%;display:flex;align-items:center;gap:8px;background:none;border:0;padding:7px 8px;border-radius:6px;color:var(--ink);text-align:left;white-space:nowrap}.tree-node.active,.tree-node:hover{background:#eef6ff;color:var(--primary)}.tree-node.department{padding-left:22px}.tree-node.team{padding-left:40px}.tree-icon{display:grid;place-items:center;flex:none;width:22px;height:22px;border-radius:4px;background:#0879ff;color:#fff}.team .tree-icon{background:#12a36a}.people-scroll{flex:1;min-height:0;overflow:auto}.people-scroll th{position:sticky;top:0;z-index:1}.people-scroll td{padding:12px 14px}.people-scroll th{padding:11px 14px}.people-scroll tr.selected-row{background:#f7fbff}.paging{display:flex;justify-content:flex-end;align-items:center;gap:10px;padding:10px 12px;font-size:12px;color:var(--muted)}.paging button{height:32px;width:32px;border:1px solid #d8e2ef;border-radius:8px;background:white;color:var(--primary)}.modal-footer{padding:16px 20px;border-top:1px solid #e7eef8;display:flex;justify-content:flex-end;gap:10px}.empty{text-align:center;padding:48px 16px;color:var(--muted)}.empty svg{display:block;margin:0 auto 12px}.empty strong{font-weight:400;color:var(--ink)}#toast{position:fixed;top:85px;left:50%;transform:translateX(-50%);background:white;border:1px solid var(--line);border-radius:8px;padding:11px 22px;box-shadow:0 8px 24px rgba(45,87,140,.14);z-index:50;display:none}.hidden{display:none!important}@media(max-width:1100px){aside{width:180px}.info{grid-template-columns:repeat(2,minmax(0,1fr))}.selector{grid-template-columns:240px minmax(0,1fr)}}@media(max-width:750px){aside{display:none}main{padding:14px}.info{grid-template-columns:1fr;gap:16px}.brand{font-size:16px}.account{display:none}.selector{grid-template-columns:190px minmax(0,1fr)}.overlay{padding:10px}.modal{height:calc(100dvh - 20px)}.section-head{flex-wrap:wrap}.tabs button{padding:0 12px}}
.source-tabs{display:flex;gap:4px;padding:4px;margin:0 12px 8px;background:#fff;border:1px solid var(--line);border-radius:8px;flex:none}.source-tabs button{flex:1;min-width:0;height:36px;border:0;border-radius:6px;background:transparent;color:var(--ink);padding:0 8px}.source-tabs button:hover{background:#eef6ff;color:var(--primary)}.source-tabs button.active{background:linear-gradient(100deg,#0879ff,#6654f7);color:#fff}</style><link rel="stylesheet" href="prototype-annotations.css"></head><body>
<header><div class="brand"><span class="shield">✓</span>安全生产统一智管平台</div><div class="account"><span class="avatar">平台</span>安全生产统一智管平台</div></header>
<div class="layout"><aside><div class="nav-title">隐患治理系统</div><div id="nav"></div></aside><main><div class="breadcrumb">隐患治理系统　/　计划管理　/　<span>计划详情</span></div><div class="page-head"><h1>计划详情</h1><button class="btn" id="back">‹ 返回</button></div><div class="panel"><div class="tabs"><button class="active">计划信息</button><button data-view="task">任务执行情况</button><button data-view="hazard">隐患清单</button></div><div id="planView"><section class="section"><div class="section-head"><h2 class="section-title">计划基本信息</h2><span class="pill gray">已结束</span></div><div class="info"><div class="field"><span class="label">计划名称</span><span>月度检查</span></div><div class="field"><span class="label">检查类型</span><span>综合巡查</span></div><div class="field"><span class="label">计划起止时间</span><span>2025-02-12 ～ 2025-02-13</span></div><div class="field"><span class="label">检查频次</span><span>不重复</span></div><div class="field"><span class="label">创建人</span><span>安全生产统一智管平台</span></div><div class="field"><span class="label">创建时间</span><span>2025-02-12 14:10:41</span></div><div class="field"><span class="label">检查执行方式</span><span>不需要逐一执行每个检查项</span></div><div class="field"><span class="label">创建单位</span><span>广西来宾广投新材料有限公司</span></div><div class="field"><span class="label">计划状态</span><span>已结束</span></div><div class="field wide"><span class="label">检查要求</span><span>--</span></div><div class="field wide"><span class="label">附件</span><button class="link" id="attachment">▤ 【火灾隐患排查系统】用户手册　↓</button></div><div class="field wide"><span class="label">检查表</span><span>月检查表</span><button class="btn blue" id="viewChecklist" style="height:30px;border-radius:6px">查看</button></div></div></section><section class="section"><div class="section-head"><h2 class="section-title">检查信息</h2></div><div class="subline"><span>检查对象</span>广西来宾广投新材料有限公司</div><div class="section-head"><h2 class="section-title">检查人信息 <span id="count" class="pill"></span></h2><div class="actions" id="actions"></div></div><div class="table-wrap"><table><thead id="thead"></thead><tbody id="rows"></tbody></table><div id="emptyPeople" hidden></div></div><div class="summary" id="summary"></div></section></div><div id="otherView" hidden></div></div></main></div>
<div class="overlay" id="picker" hidden><div class="modal" role="dialog" aria-modal="true" aria-labelledby="pickerTitle"><div class="modal-head"><h2 id="pickerTitle">选择检查人员</h2><button class="close" data-close aria-label="关闭">×</button></div><div class="selected"><span class="selected-label">已选人员：</span><div class="chips" id="chips"></div></div><div class="selector"><div class="tree-panel"><div class="search-bar"><input class="search" id="orgSearch" placeholder="搜索部门或班组" aria-label="搜索部门或班组"></div><div class="tree-caption source-tabs" role="tablist" aria-label="人员来源"><button id="orgTab" class="active" role="tab" aria-selected="true" aria-controls="tree">组织架构</button><button id="partyTab" role="tab" aria-selected="false" aria-controls="tree">相关方</button></div><div class="tree" id="tree"></div></div><div class="people-panel"><div class="search-bar"><input class="search" id="personSearch" placeholder="搜索人员姓名" aria-label="搜索人员姓名"></div><div class="people-scroll"><table><thead><tr><th><input type="checkbox" id="all" aria-label="选择本页全部人员"></th><th>姓名</th><th>账号</th><th>手机号</th><th>部门</th><th>班组</th><th>岗位</th></tr></thead><tbody id="candidates"></tbody></table><div id="noResults" hidden></div></div><div class="paging"><span id="total"></span><button id="prev" aria-label="上一页">‹</button><span id="page"></span><button id="next" aria-label="下一页">›</button></div></div></div><div class="modal-footer"><button class="btn" data-close>取消</button><button class="btn primary" id="confirmPeople">确认添加</button></div></div></div><div id="toast" role="status"></div>
<script>
const $=id=>document.getElementById(id),company='广西来宾广投新材料有限公司',key='hazard-plan-inspectors-v1';
const names=['简文豪','桂奇','黄国系','卢海贵','韦栋','姚尚星','李志强','陈建国','王海峰','刘志勇','周文斌','梁晓东','莫志明','何俊','罗敏','韦宝亭'];
const teams=['生产一班','生产一班','生产一班','生产一班','生产二班','生产二班','生产四班','生产四班','生产三班','生产三班','锯切班','质检班','维修班','仓库班'];
const people=names.map((name,id)=>({id,name,dept:id<14?'生产管理部':id===14?'综合管理部':'安全环保部',team:teams[id]||'--',post:id<10?(id%2?'副操':'主操'):['锯切操作','质量检验','维修工','仓管员','行政专员','安全员'][id-10]}));
let saved=[{id:0,role:'检查负责人'},{id:1,role:'检查参与人'}];try{const data=JSON.parse(localStorage.getItem(key));if(Array.isArray(data)&&data.every(x=>people[x.id]&&['检查负责人','检查参与人'].includes(x.role)))saved=data}catch(e){}let draft=[],editing=false,selected=new Set(),org='',source='org',page=1,visible=[];let timer;
const empty=message=>`<div class="empty"><svg width="72" height="60" viewBox="0 0 72 60" fill="none" aria-hidden="true"><path d="M14 14h30l14 14v25H14z" fill="#eef6ff" stroke="#bed3ee"/><path d="M44 14v14h14M24 36h24M24 43h17" stroke="#a9c9ff" stroke-width="2"/></svg><strong>${message}</strong></div>`;
function toast(s){$('toast').textContent=s;$('toast').style.display='block';clearTimeout(timer);timer=setTimeout(()=>$('toast').style.display='none',3000)}
$('nav').innerHTML=['数据分析','统计报表','计划管理','任务管理','扫码检查','随机检查','举一反三','隐患随手拍','隐患整改','检查表','巡查点位管理','隐患数据库','参数配置'].map((n,i)=>`<div class="nav-item ${i===2?'active':''}"><span class="nav-icon">${['▥','▤','▣','▧','⌗','♙','♧','▯','⚙','▤','△','▦','⚙'][i]}</span>${n}</div>`).join('');
function render(){const list=editing?draft:saved;$('count').textContent=list.length+' 人';$('actions').innerHTML=editing?'<button class="btn blue" id="add">＋ 添加检查人员</button><button class="btn" id="cancel">取消</button><button class="btn primary" id="save">保存</button>':'<button class="btn blue" id="edit">修改人员</button>';$('thead').innerHTML='<tr><th class="num">序号</th><th>检查人姓名</th><th>单位</th><th>检查人类型</th>'+(editing?'<th>操作</th>':'')+'</tr>';$('rows').innerHTML=list.map((x,i)=>`<tr><td>${i+1}</td><td>${people[x.id].name}</td><td>${company}</td><td>${editing?['检查负责人','检查参与人'].map(r=>`<label class="radio"><input type="radio" name="role${x.id}" value="${r}" data-role="${x.id}" ${r===x.role?'checked':''}>${r}</label>`).join(''):`<span class="pill ${x.role==='检查参与人'?'gray':''}">${x.role}</span>`}</td>${editing?`<td><button class="btn danger" data-delete="${x.id}">删除</button></td>`:''}</tr>`).join('');$('emptyPeople').hidden=!!list.length;$('emptyPeople').innerHTML=list.length?'':empty('暂无检查人员');$('summary').textContent=`共 ${list.length} 人　｜　检查负责人 ${list.filter(x=>x.role==='检查负责人').length} 人　｜　检查参与人 ${list.filter(x=>x.role==='检查参与人').length} 人`;if(editing){$('add').onclick=openPicker;$('cancel').onclick=()=>{editing=false;draft=[];render()};$('save').onclick=()=>{if(!draft.length)return toast('请至少添加一名检查人员');try{localStorage.setItem(key,JSON.stringify(draft))}catch(e){return toast('保存失败，请检查浏览器存储权限后重试')}saved=structuredClone(draft);editing=false;render();toast('检查人员已保存')}}else $('edit').onclick=()=>{draft=structuredClone(saved);editing=true;render()}}
$('rows').onclick=e=>{const b=e.target.closest('[data-delete]');if(b&&confirm('确定从本计划中移除 '+people[+b.dataset.delete].name+' 吗？保存后生效。')){draft=draft.filter(x=>x.id!==+b.dataset.delete);render()}};$('rows').onchange=e=>{if(e.target.dataset.role!==undefined)draft.find(x=>x.id===+e.target.dataset.role).role=e.target.value};
const orgs=[{name:company,type:'company'},...['经营层','综合管理部','生产管理部'].map(name=>({name,type:'department'})),...['锯切班','生产一班','生产二班','生产四班','生产三班','质检班','维修班','行政','仓库班','结晶器维修班'].map(name=>({name,type:'team'})),...['财务部','安全环保部','劳务工作人员'].map(name=>({name,type:'department'}))];
function renderTree(){if(source==='party'){$('tree').innerHTML=empty('暂无相关方');return}$('tree').innerHTML=orgs.filter(x=>x.name.includes($('orgSearch').value.trim())).map(x=>`<button class="tree-node ${x.type} ${org===x.name||!org&&x.type==='company'?'active':''}" data-org="${x.name}"><span class="tree-icon">${x.type==='team'?'♧':'▤'}</span>${x.name}</button>`).join('')||empty('无匹配组织')}
function filtered(){if(source==='party')return [];return people.filter(p=>!draft.some(x=>x.id===p.id)&&(!org||org===company||p.dept===org||p.team===org)&&p.name.includes($('personSearch').value.trim()))}
function renderPicker(){const result=filtered(),pages=Math.max(1,Math.ceil(result.length/10));page=Math.min(page,pages);visible=result.slice((page-1)*10,page*10);$('candidates').innerHTML=visible.map(p=>`<tr class="${selected.has(p.id)?'selected-row':''}"><td><input type="checkbox" data-person="${p.id}" aria-label="选择${p.name}" ${selected.has(p.id)?'checked':''}></td><td>${p.name}</td><td>未录入</td><td>未录入</td><td>${p.dept}</td><td>${p.team}</td><td>${p.post}</td></tr>`).join('');$('noResults').hidden=!!result.length;$('noResults').innerHTML=result.length?'':empty('暂无可选人员');$('total').textContent='共 '+result.length+' 人';$('page').textContent=page+' / '+pages;$('prev').disabled=page===1;$('next').disabled=page===pages;$('all').disabled=!visible.length;$('all').checked=!!visible.length&&visible.every(p=>selected.has(p.id));$('all').indeterminate=visible.some(p=>selected.has(p.id))&&!$('all').checked;$('chips').innerHTML=[...selected].map(id=>`<span class="chip">${people[id].name}<button data-remove="${id}" aria-label="移除${people[id].name}">×</button></span>`).join('')||'<span style="color:var(--muted);font-size:12px;padding-top:4px">暂未选择人员</span>';$('confirmPeople').textContent=selected.size?'确认添加（'+selected.size+'）':'确认添加';$('confirmPeople').disabled=!selected.size}
function openPicker(){selected=new Set();source='org';org='';page=1;syncSourceTabs();$('orgSearch').value='';$('personSearch').value='';$('picker').hidden=false;document.body.style.overflow='hidden';renderTree();renderPicker();$('personSearch').focus()}
function syncSourceTabs(){['org','party'].forEach(s=>{const b=$(s+'Tab');b.classList.toggle('active',source===s);b.setAttribute('aria-selected',String(source===s))});$('orgSearch').placeholder=source==='party'?'搜索相关方':'搜索部门或班组';$('orgSearch').setAttribute('aria-label',$('orgSearch').placeholder)}
function switchSource(next){if(source===next)return;source=next;org='';page=1;$('orgSearch').value='';syncSourceTabs();renderTree();renderPicker()}
$('orgTab').onclick=()=>switchSource('org');$('partyTab').onclick=()=>switchSource('party');
function closePicker(){$('picker').hidden=true;document.body.style.overflow='';$('add')?.focus()}
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closePicker);$('tree').onclick=e=>{const b=e.target.closest('[data-org]');if(b){org=b.dataset.org;page=1;renderTree();renderPicker()}};$('orgSearch').oninput=renderTree;$('personSearch').oninput=()=>{page=1;renderPicker()};$('candidates').onchange=e=>{const id=+e.target.dataset.person;e.target.checked?selected.add(id):selected.delete(id);renderPicker()};$('all').onchange=e=>{visible.forEach(p=>e.target.checked?selected.add(p.id):selected.delete(p.id));renderPicker()};$('chips').onclick=e=>{const b=e.target.closest('[data-remove]');if(b){selected.delete(+b.dataset.remove);renderPicker()}};$('prev').onclick=()=>{page--;renderPicker()};$('next').onclick=()=>{page++;renderPicker()};$('confirmPeople').onclick=()=>{draft.push(...[...selected].filter(id=>!draft.some(x=>x.id===id)).map(id=>({id,role:'检查参与人'})));closePicker();render();toast('已加入待保存名单')};
document.addEventListener('keydown',e=>{if(!$('picker').hidden){if(e.key==='Escape')closePicker();if(e.key==='Tab'){const items=[...$('picker').querySelectorAll('button:not(:disabled),input:not(:disabled)')].filter(x=>x.getClientRects().length),first=items[0],last=items.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}}});
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{if(editing){toast('请先保存或取消人员修改');return}document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x===b));$('planView').hidden=!!b.dataset.view;$('otherView').hidden=!b.dataset.view;$('otherView').innerHTML=empty(b.dataset.view==='task'?'暂无任务执行记录':'暂无隐患记录')});$('back').onclick=()=>{if(editing&&!confirm('人员修改尚未保存，确定离开吗？'))return;location.href='index.html'};$('attachment').onclick=()=>toast('暂未上传可下载的附件');$('viewChecklist').onclick=()=>toast('暂未接入月检查表内容');window.addEventListener('beforeunload',e=>{if(editing){e.preventDefault();e.returnValue=''}});render();
</script><script src="prototype-annotations-data.js"></script><script src="prototype-annotations.js"></script></body></html>
